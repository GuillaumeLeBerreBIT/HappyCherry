{% extends "happy_cherries/base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <!-- Box for login content -->
            <div class="card shadow-sm">
                <div class="card-body">
                    <!-- Pills navs -->
                    <ul class="nav nav-pills nav-justified mb-3" id="login-tabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <a class="nav-link active" id="tab-login" data-bs-toggle="pill" href="#login" role="tab"
                               aria-controls="login" aria-selected="true">Login</a>
                        </li>
                        <li class="nav-item" role="presentation">
                            <a class="nav-link" id="tab-register" href="{% url 'users:register' %}">Register</a>
                        </li>
                    </ul>
                    <!-- Pills navs -->

                    <!-- Pills content -->
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="login" role="tabpanel" aria-labelledby="tab-login">
                            <form method="post" action="{% url 'users:login' %}">
                                {% csrf_token %}
                                
                                {% if form.errors %}
                                    <div class="alert alert-danger">
                                        Your username and password didn't match. Please try again.
                                    </div>
                                {% endif %}

                                <!-- Username input -->
                                <div class="mb-3">
                                    <label for="id_username" class="form-label">Username</label>
                                    {{ form.username }}
                                </div>

                                <!-- Password input -->
                                <div class="mb-3">
                                    <label for="id_password" class="form-label">Password</label>
                                    {{ form.password }}
                                </div>

                                <!-- Remember me and forgot password -->
                                <div class="d-flex justify-content-between mb-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="rememberMe" />
                                        <label class="form-check-label" for="rememberMe">Remember me</label>
                                    </div>
                                </div>

                                <!-- Submit button -->
                                <button type="submit" class="btn btn-primary w-100">Log in</button>
                                
                                <!-- Hidden next input -->
                                <input type="hidden" name="next" value="{% url 'happy_cherries:index' %}">
                            </form>

                            <!-- Register link -->
                            <div class="text-center mt-3">
                                <p>Not a member? <a href="{% url 'users:register' %}">Register</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock content %}
