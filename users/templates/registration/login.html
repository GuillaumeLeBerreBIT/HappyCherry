{% extends "happy_cherries/base.html" %}

{% block content %}

    {% if form.errors %}
        <p>Your username and password didn't match. Please try again.</p>
    {% endif %}

    <form method='post' action="{% url 'users:login' %}">
        {% csrf_token %}
        {{ form.as_p}}

        <button name="submit">Log in</button>
        <input type="hidden" name="next"
        value="{% url 'happy_cherries:index' %}"/>
        <!--Include a hidden element 'next', telling Django to redirect the user
        after they've succesfully logged in.-->
    </form>

{% endblock content %}
