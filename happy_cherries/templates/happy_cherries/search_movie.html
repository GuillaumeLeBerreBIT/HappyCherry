{% extends "happy_cherries/base.html" %}

{% block content %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="movie_query" placeholder="Search Movie">
        <button type="submit">Search</button>
    </form>

    <!--If this list exists -->
    {% if movie_list %}
    <ul>
        {% for movie in movie_list %}
            <li>
                <a href="{% url 'happy_cherries:requested_movie' movie.id %}">{{ movie.original_title }}</a></li>
        {% endfor %}
    </ul>
    {% endif %}

{% endblock content %}
