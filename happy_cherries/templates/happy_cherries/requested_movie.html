{% extends "happy_cherries/base.html" %}

{% block content %}

<h2>{{ movie.original_title }}</h2>

<img src={{movie.poster}} alt="movie_poster">

<p>{{ movie.overview }}</p>

<p>{{ movie.release_date }}</p>

<ul>
    {% for genre in movie.genres %}
        <li>{{genre}}</li>
    {% endfor %}
</ul>

<form method="post">
    {% csrf_token %}
    <button type="submit">Save</button>
</form>

{% endblock content %}
