{% extends "happy_cherries/base.html" %}

{% block content %}

<a href="{% url 'happy_cherries:add_tvshow_manual' %}">Add Tv Show</a> - 
<a href="{% url 'happy_cherries:search_tvshow' %}">Search Tv Show</a>

<h2>TV Shows</h2>

<ul>
    {% for shows in tv_shows %}
        <li>{{shows.title}}</li>
    {% empty %}
        <li>No TV shows have been added yet.</li>
    {% endfor %}
</ul>

{% endblock content %}
